[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirroropd"
dynamic = ["version"]
description = "MirrorOPD production training kernels and research validation"
requires-python = ">=3.12"
dependencies = ["torch>=2.7,<2.8", "numpy>=1.26,<3"]

[project.optional-dependencies]
data = ["pandas>=2.2,<4", "pyarrow>=17,<22", "transformers==4.57.6"]
backend = [
  "hydra-core>=1.3,<1.4",
  "omegaconf>=2.3,<2.4",
  "tensordict>=0.10,<0.11",
  "psutil>=7,<8",
  "ray>=2.49,<3",
]
tracking = ["wandb>=0.30,<1"]
math = [
  "math-verify==0.9.0",
  "sympy==1.14.0",
  "latex2sympy2-extended==1.11.0",
  "pylatexenc>=2.10,<3",
]
test = [
  "pytest>=8,<10",
  "pandas>=2.2,<4",
  "pyarrow>=17,<22",
  "transformers==4.57.6",
  "hydra-core>=1.3,<1.4",
  "omegaconf>=2.3,<2.4",
  "psutil>=7,<8",
  "markdown-it-py==4.0.0",
  "PyYAML==6.0.3",
]

[project.scripts]
mirroropd = "mirroropd.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mirroropd.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mirroropd = [
  "profiles/*/*.json",
  "integrations/verl/backend.json",
  "integrations/verl/backend.patch",
  "scoring/vendor/LICENSE",
  "scoring/vendor/NOTICE",
  "scoring/vendor/origin.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

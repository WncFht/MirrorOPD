title = "MirrorOPD"

[extend]
useDefault = true

# 历史已提交的秘密按精确值放行（regexTarget=line 匹配整行，值不变即豁免）。
# 只放已经入库的既定事实；新值仍会命中规则。不要用 paths 整文件放行。
# [allowlist]
# regexTarget = "line"
# regexes = ['''password: "EXACT-LEGACY-VALUE"''']

# 自有凭据格式：真实值在任意已入库文件都拦，占位符放行。
# 例：面板账密只应存在于 gitignored 的 xxx.env；example 文件的占位符豁免。
# [[rules]]
# id = "my-credential"
# description = "My credential (live value; placeholder allowed)"
# regex = '''MY_CREDENTIAL=[^\s#]+'''
# [rules.allowlist]
# regexTarget = "line"
# regexes = ['''your-placeholder-''']

# Provenance files contain SHA-256 digests, not credentials. The generic-api-key
# detector misclassifies three digest lines because their filenames contain
# ``token``; keep the exception limited to the generated provenance artifact.
[[allowlists]]
description = "Generated source SHA-256 provenance"
paths = [
  '''^results/training/pythia-mdpo(-low-lr|-eta-(0p03|0p3|1|inf))?/source-provenance\.json$''',
]
regexTarget = "line"
regexes = [
  '''"(?:first_party/src/mirroropd/token_inner|framework/verl/utils/tokenizer|framework/verl/workers/rollout/tokenizer)\.py": "[0-9a-f]{64}"''',
]

# These exact fields record source digests in the GSM8K execution evidence.
[[allowlists]]
description = "GSM8K source SHA-256 provenance fields"
paths = [
  '''^results/training/gsm8k-smollm2-mdpo-(b64-j16-clip5|launcher-check|offload-check)/source-provenance\.json$''',
]
regexTarget = "line"
regexes = [
  '''"(?:first_party/src/mirroropd/training/tokenization|framework/verl/trainer/distillation/token_inner)\.py": "[0-9a-f]{64}"''',
]

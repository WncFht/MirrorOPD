target-version = "py312"
line-length = 100
extend-exclude = [
  "upstream",
  "archives",
  ".crossnote",
  ".claude",
  "node_modules",
  "runs",
  "src/mirroropd/scoring/vendor", # Pinned mathematical graders retain upstream formatting.
  ".agents/notes/archived",       # Frozen decision records and registered attachments.
  "assets/.crossnote",            # Vendored preview payload has its own test suite.
  ".venv-maintenance",            # Project-local maintenance interpreter.
  "theory",                       # Theory sources await user review and merging.
]

[lint]
select = ["ALL"]
ignore = [
  "COM812",  # Ruff formatter owns trailing commas.
  "D",       # Research scripts document algorithms in the accompanying LaTeX book.
  "ANN",     # Tensor dimensions and data schemas are validated by numerical tests.
  "T201",    # CLI progress and experiment summaries intentionally use print.
  "RUF001",
  "RUF002",
  "RUF003",  # Chinese prose and mathematical Unicode are intentional.
  "CPY001",  # Project authorship is recorded in Git rather than per-file headers.
  "PLR2004", # Numeric constants encode experiment grids and mathematical coefficients.
  "S101",    # Research correctness checks intentionally use assertions.
  "E501",    # Ruff formatter determines wrapping; immutable citations may exceed width.
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR0917",
  "C901",    # Scientific kernels retain equations and explicit hyperparameters together.
  "FBT003",  # Plot visibility flags and tensor validation controls are library APIs.
  "TRY003",
  "EM101",
  "EM102",   # CLI validation errors are contextual messages rather than custom exception classes.
  "PLC0415", # Optional plotting/model packages are imported only by their selected CLI modes.
  "ICN001",
  "N812",    # Torch functional F and plotting backends follow scientific package conventions.
  "S311",
  "NPY002",  # Seeded pseudorandomness is for reproducible Monte Carlo experiments.
  "PTH123",  # File-stream APIs intentionally use built-in open for JSONL data.
  "PD011",   # Numeric CSV array extraction does not rely on extension dtypes.
  "PERF203", # Per-prefix numerical validation reports failures without losing the experiment batch.
  "INP001",  # Experiment scripts are executable entry points rather than an import package.
]

[lint.per-file-ignores]
# Imported standalone maintenance tools execute explicit command vectors.
"scripts/check_docs.py" = ["TRY004", "TRY301"]
"scripts/check_package.py" = ["S603"]
"scripts/check_spacing.py" = ["S603", "S607"]
"scripts/check_shell.py" = ["S603"]
"scripts/check-yaml-comments.py" = ["S607"]
"scripts/hook_entry.py" = ["S603", "S607"]
"scripts/install_hooks.py" = ["S603", "S607"]
"scripts/notes_guard.py" = ["S603", "S607", "TRY004", "FBT001"]
"scripts/run_checks.py" = ["S603", "TRY004", "TRY301"]
"scripts/setup.py" = ["S607"]
"scripts/staged_checks.py" = ["S603", "S607"]
# Preserve the imported unittest fixtures; pytest collects and executes them.
"tests/maintenance/*.py" = ["S603", "S607", "PT009", "PT027", "FBT002"]
"tests/test_*.py" = [
  "SLF001",
  "S102",
  "S607",
] # Tests inspect frozen caches and estimator internals.

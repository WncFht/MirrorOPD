exclude: ^(upstream/|archives/|node_modules/|docs/book-old/|experiments/plotting/vendor/|src/mirroropd/scoring/vendor/)
repos:
  # 顺序即语义：原地改写型 fixer（markdownlint --fix）在前，改了就 fail 一次
  # 让你 re-add；git-format-staged 链式 formatter 只写 index 收尾——commit
  # 永远成功，混合暂存时未暂存的编辑不受污染。
  # prettier / markdownlint-cli2 / gfs 版本以 package.json 为唯一事实源；
  # autocorrect 等系统工具走 brew。
  #
  # 本文件是通用 base：每个仓库都有 markdown + yaml + gitleaks。
  # 其他文件类型的 hook 块按 census 结果从 skill 的 references/recipes.md
  # 逐卡追加到下面的 hooks: 列表（缩进与现有条目一致）。
  - repo: local
    hooks:
      - id: markdownlint-cli2
        name: markdownlint-cli2 --fix
        entry: ./node_modules/.bin/markdownlint-cli2 --fix
        language: system
        types: [markdown]
      # ⚠ 若仓内另有「按显示宽度对齐表格」的约定/工具（MD060 CJK=2、
      # md_table_align 类 realign 脚本），prettier 按字符宽补白会与之
      # 乒乓——此时 md 链改 autocorrect-only（去掉 `| prettier`），并同步
      # 划出 package.json format glob 的 **/*.md 与 .vscode 的 md formatter
      - id: prettier-md
        name: autocorrect + prettier (staged content)
        entry: ./node_modules/.bin/git-format-staged --formatter "autocorrect --stdin | ./node_modules/.bin/prettier --stdin-filepath {}"
        language: system
        types: [markdown]
      - id: prettier-yaml
        name: prettier (staged content)
        entry: ./node_modules/.bin/git-format-staged --formatter "./node_modules/.bin/prettier --stdin-filepath {}"
        language: system
        types: [yaml]
      # yaml 散文注释 ≤80 显示列（CJK 按 2 列计——yamllint 只数字符所以
      # 自写）。check 类、失败才拦；断点该落标点/从句边界是语义判断，
      # 机检只管宽度，断点靠人工（机械重排用编辑器 reflow）。
      - id: yaml-comment-width
        name: yaml comment width (display cols)
        entry: python3 scripts/check-yaml-comments.py
        language: system
        types: [yaml]
      - id: prettier-json
        name: prettier JSON (staged content)
        entry: ./node_modules/.bin/git-format-staged --formatter "./node_modules/.bin/prettier --stdin-filepath {}"
        language: system
        files: '^(?!(results|data|runs)/).*\.jsonc?$'
      - id: ruff-format
        name: ruff format (staged content)
        entry: ./node_modules/.bin/git-format-staged --formatter "ruff format --stdin-filename {} -"
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: shfmt
        name: shfmt (staged content; zsh passthrough)
        entry: ./node_modules/.bin/git-format-staged --formatter "bash scripts/fmt-shell.sh"
        language: system
        types: [shell]
      - id: shellcheck
        name: shellcheck (bash only)
        entry: bash scripts/check-shell.sh
        language: system
        types: [shell]
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: '^\.github/workflows/.*\.ya?ml$'
      - id: taplo
        name: taplo format (staged content)
        entry: ./node_modules/.bin/git-format-staged --formatter "taplo fmt -"
        language: system
        types: [toml]
      - id: gitleaks
        name: gitleaks staged diff
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false

name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install toolchain
        run: |
          npm ci
          brew install shfmt shellcheck ruff gitleaks actionlint taplo
      - run: npm run format:check
      - run: npm run lint
      - run: ruff format --check .
      - name: Shell formatting
        run: |
          while IFS= read -r -d '' file; do
            head -1 "$file" | grep -q zsh || shfmt -d -i 2 "$file"
          done < <(git ls-files -z '*.sh' '.githooks/*')
      - run: taplo fmt --check
      - run: gitleaks git --redact
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'torch>=2.7,<2.8' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[data,test,math]'
      - name: Restore the pinned integration
        run: python -m mirroropd backend --output upstream/TA-OPD-v2
      - name: Run all collected numerical and runtime tests
        run: MIRROR_TEST_BACKEND=upstream/TA-OPD-v2 make test

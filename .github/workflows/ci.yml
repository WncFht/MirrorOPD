name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install maintenance tools
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          npm ci
          npx playwright install --with-deps chromium
          brew install autocorrect shfmt shellcheck gitleaks actionlint taplo zsh
          autocorrect --version
          ruff --version
          gitleaks version
          taplo --version
          actionlint --version
          shfmt --version
          shellcheck --version
          zsh --version
      - name: Check maintenance, preview and formatting
        run: make check
      - run: gitleaks git --redact
  archive-history:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Use target-branch archive policy
        env:
          TARGET_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$TARGET_BASE:scripts/check_archive.py" 2>/dev/null; then
            policy_dir=$(mktemp -d)
            trap 'rm -rf "$policy_dir"' EXIT
            git show "$TARGET_BASE:scripts/notes_guard.py" > "$policy_dir/notes_guard.py"
            git show "$TARGET_BASE:scripts/check_archive.py" > "$policy_dir/check_archive.py"
            python "$policy_dir/check_archive.py" --root "$GITHUB_WORKSPACE" --base "$TARGET_BASE"
          else
            # Initial adoption establishes policy before any records are sealed.
            test ! -e .agents/notes/archive-seals.json
            test -z "$(find .agents/notes/archived -type f ! -name AGENTS.md -print -quit)"
            echo "Initial adoption: no sealed records; target-branch policy begins after merge."
          fi
  numerical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'torch>=2.7,<2.8' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[data,backend,tracking,test,math]'
      - name: Restore the pinned integration
        run: python -m mirroropd backend --output upstream/TA-OPD-v2
      - name: Run all collected tests
        run: MIRROR_TEST_BACKEND=upstream/TA-OPD-v2 python -m pytest -q --ignore=tests/maintenance
      - name: Build and validate the wheel
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir dist
          python -m venv --system-site-packages "$RUNNER_TEMP/mirroropd-wheel"
          "$RUNNER_TEMP/mirroropd-wheel/bin/python" -m pip install --no-deps --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/mirroropd-wheel/bin/python" "$GITHUB_WORKSPACE/scripts/check_package.py"
      - uses: actions/upload-artifact@v4
        with:
          name: mirroropd-wheel
          path: dist/*.whl
